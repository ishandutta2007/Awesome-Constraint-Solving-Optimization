<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
    </pattern>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.7; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5px; opacity: 0.8; }
        50% { r: 7.5px; opacity: 1; }
      }
      
      .bg-pulse { animation: pulse 8s ease-in-out infinite; transform-origin: center; }
      .floating-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-card-2 { animation: floatOpposite 6s ease-in-out infinite; }
      .opt-path { stroke-dasharray: 8, 8; animation: dashAnim 20s linear infinite; }
      .pulse-node { animation: nodeGlow 3s ease-in-out infinite; }
      
      .main-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .sub-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Ambient Glowing Orbs (Behind everything) -->
  <circle cx="200" cy="80" r="140" fill="url(#glowGrad)" class="bg-pulse" />
  <circle cx="1020" cy="260" r="160" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay: -3s;" />
  <circle cx="650" cy="180" r="110" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay: -5s;" />

  <!-- Dynamic Constraint Network / Mathematical Graph (Background) -->
  <g opacity="0.35">
    <path class="opt-path" d="M 800 60 L 930 110 L 1080 70 L 1140 180 L 1020 280 L 890 220 L 760 260 Z" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="opt-path" d="M 930 110 L 1020 280 M 890 220 L 1080 70 M 800 60 L 890 220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" />
    
    <circle cx="800" cy="60" r="5" fill="#38bdf8" class="pulse-node" />
    <circle cx="930" cy="110" r="6" fill="#818cf8" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="1080" cy="70" r="5" fill="#c084fc" class="pulse-node" style="animation-delay: 2s;" />
    <circle cx="1140" cy="180" r="6" fill="#38bdf8" class="pulse-node" />
    <circle cx="1020" cy="280" r="7" fill="#ec4899" class="pulse-node" style="animation-delay: 1.5s;" />
    <circle cx="890" cy="220" r="5" fill="#818cf8" class="pulse-node" style="animation-delay: 0.5s;" />
    <circle cx="760" cy="260" r="5" fill="#38bdf8" class="pulse-node" />
  </g>

  <!-- Interactive Floating Optimization Solution Cards (Right side, behind foreground text) -->
  <g class="floating-card-1" filter="url(#shadow)" transform="translate(820, 50)">
    <rect width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="28" cy="30" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M 24 30 L 27 33 L 33 26" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="34" class="badge-text" font-size="14">MIP Optimum Found</text>
    <text x="48" y="54" class="code-font">Objective: 142,850.00</text>
    <text x="48" y="70" class="sub-title" font-size="11" fill="#64748b">Gap: 0.00% | Simplex iterations: 4.1k</text>
  </g>

  <g class="floating-card-2" filter="url(#shadow)" transform="translate(870, 180)">
    <rect width="270" height="96" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="28" cy="32" r="10" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="28" cy="32" r="4" fill="#818cf8" />
    <text x="48" y="34" class="badge-text" font-size="14">CP-SAT / SMT Verified</text>
    <text x="48" y="55" class="code-font">Status: Feasible &amp; Validated</text>
    <text x="48" y="72" class="sub-title" font-size="11" fill="#64748b">Constraints: 52,400 | Solvers: Active</text>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (Guaranteed clean view, high contrast, top layer) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 65)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="32" y="21" class="badge-text" fill="#38bdf8" font-size="12" letter-spacing="0.5">OPERATIONS RESEARCH &amp; SOLVERS</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="145" class="main-title">
      Awesome <tspan fill="url(#accentGrad)">Constraint Solving</tspan>
    </text>
    <text x="0" y="188" class="main-title" font-size="34" fill="#f8fafc">
      &amp; Mathematical Optimization
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="226" class="sub-title">
      Curated index of high-performance MILP, CP-SAT, SAT/SMT solvers,
    </text>
    <text x="0" y="250" class="sub-title">
      algebraic modeling languages (AML), vehicle routing engines &amp; cloud decision platforms.
    </text>

    <!-- Tech Badges / Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="17" class="badge-text" font-size="11" fill="#94a3b8">⚡ MILP / LP</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(100, 0)">
        <rect width="96" height="26" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="17" class="badge-text" font-size="11" fill="#94a3b8">🧩 CP-SAT</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(206, 0)">
        <rect width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="17" class="badge-text" font-size="11" fill="#94a3b8">🔬 SMT / SAT</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(328, 0)">
        <rect width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="17" class="badge-text" font-size="11" fill="#94a3b8">🚚 VRP Routing</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(466, 0)">
        <rect width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="17" class="badge-text" font-size="11" fill="#94a3b8">📐 Julia / Python</text>
      </g>
    </g>
  </g>
</svg>

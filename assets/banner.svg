<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".2" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><filter id="glow"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.08);opacity:.7}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatOpposite{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes nodeGlow{0%{r:5px;opacity:.8}50%{r:7.5px;opacity:1}}.bg-pulse{animation:pulse 8s ease-in-out infinite;transform-origin:center}.floating-card-1{animation:floatSlow 5s ease-in-out infinite}.floating-card-2{animation:floatOpposite 6s ease-in-out infinite}.opt-path{stroke-dasharray:8,8;animation:dashAnim 20s linear infinite}.pulse-node{animation:nodeGlow 3s ease-in-out infinite}.main-title,.sub-title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.main-title{font-weight:800;font-size:38px;fill:#fff;letter-spacing:-.5px}.sub-title{font-weight:400;font-size:16px;fill:#94a3b8}.badge-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600;font-size:13px;fill:#e2e8f0}.code-font{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:#38bdf8}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="200" cy="80" r="140" fill="url(#glowGrad)" class="bg-pulse"/><circle cx="1020" cy="260" r="160" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay:-3s"/><circle cx="650" cy="180" r="110" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay:-5s"/><g opacity=".35"><path fill="none" stroke="#6366f1" stroke-width="2" d="M 800 60 L 930 110 L 1080 70 L 1140 180 L 1020 280 L 890 220 L 760 260 Z" class="opt-path"/><path fill="none" stroke="#38bdf8" stroke-dasharray="5 5" stroke-width="1.5" d="M 930 110 L 1020 280 M 890 220 L 1080 70 M 800 60 L 890 220" class="opt-path"/><circle cx="800" cy="60" r="5" fill="#38bdf8" class="pulse-node"/><circle cx="930" cy="110" r="6" fill="#818cf8" class="pulse-node" style="animation-delay:1s"/><circle cx="1080" cy="70" r="5" fill="#c084fc" class="pulse-node" style="animation-delay:2s"/><circle cx="1140" cy="180" r="6" fill="#38bdf8" class="pulse-node"/><circle cx="1020" cy="280" r="7" fill="#ec4899" class="pulse-node" style="animation-delay:1.5s"/><circle cx="890" cy="220" r="5" fill="#818cf8" class="pulse-node" style="animation-delay:.5s"/><circle cx="760" cy="260" r="5" fill="#38bdf8" class="pulse-node"/></g><g class="floating-card-1" filter="url(#shadow)" transform="translate(820, 50)"><rect width="280" height="90" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".8" stroke-width="1.2" rx="12"/><circle cx="28" cy="30" r="10" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="1.5"/><path fill="none" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 24 30 L 27 33 L 33 26"/><text x="48" y="34" class="badge-text" font-size="14">MIP Optimum Found</text><text x="48" y="54" class="code-font">Objective: 142,850.00</text><text x="48" y="70" fill="#64748b" class="sub-title" font-size="11">Gap: 0.00% | Simplex iterations: 4.1k</text></g><g class="floating-card-2" filter="url(#shadow)" transform="translate(870, 180)"><rect width="270" height="96" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".8" stroke-width="1.2" rx="12"/><circle cx="28" cy="32" r="10" fill="#6366f1" fill-opacity=".2" stroke="#818cf8" stroke-width="1.5"/><circle cx="28" cy="32" r="4" fill="#818cf8"/><text x="48" y="34" class="badge-text" font-size="14">CP-SAT / SMT Verified</text><text x="48" y="55" class="code-font">Status: Feasible &amp; Validated</text><text x="48" y="72" fill="#64748b" class="sub-title" font-size="11">Constraints: 52,400 | Solvers: Active</text></g><g><g transform="translate(80, 0) translate(0, 65)"><rect width="320" height="32" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.2" rx="16"/><circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/><text x="32" y="21" fill="#38bdf8" class="badge-text" font-size="12" letter-spacing=".5">OPERATIONS RESEARCH &amp; SOLVERS</text></g><text x="0" y="145" class="main-title" transform="translate(80, 0)">Awesome <tspan fill="url(#accentGrad)">Constraint Solving</tspan></text><text x="0" y="188" fill="#f8fafc" class="main-title" font-size="34" transform="translate(80, 0)">&amp; Mathematical Optimization</text><text x="0" y="226" class="sub-title" transform="translate(80, 0)">Curated index of high-performance MILP, CP-SAT, SAT/SMT solvers,</text><text x="0" y="250" class="sub-title" transform="translate(80, 0)">algebraic modeling languages (AML), vehicle routing engines &amp; cloud decision platforms.</text><g><g transform="translate(80, 0) translate(0, 275) translate(0, 0)"><rect width="90" height="26" fill="#1e293b" stroke="#334155" rx="6"/><text x="12" y="17" fill="#94a3b8" class="badge-text" font-size="11">⚡ MILP / LP</text></g><g transform="translate(80, 0) translate(0, 275) translate(100, 0)"><rect width="96" height="26" fill="#1e293b" stroke="#334155" rx="6"/><text x="12" y="17" fill="#94a3b8" class="badge-text" font-size="11">🧩 CP-SAT</text></g><g transform="translate(80, 0) translate(0, 275) translate(206, 0)"><rect width="112" height="26" fill="#1e293b" stroke="#334155" rx="6"/><text x="12" y="17" fill="#94a3b8" class="badge-text" font-size="11">🔬 SMT / SAT</text></g><g transform="translate(80, 0) translate(0, 275) translate(328, 0)"><rect width="128" height="26" fill="#1e293b" stroke="#334155" rx="6"/><text x="12" y="17" fill="#94a3b8" class="badge-text" font-size="11">🚚 VRP Routing</text></g><g transform="translate(80, 0) translate(0, 275) translate(466, 0)"><rect width="138" height="26" fill="#1e293b" stroke="#334155" rx="6"/><text x="12" y="17" fill="#94a3b8" class="badge-text" font-size="11">📐 Julia / Python</text></g></g></g></svg>